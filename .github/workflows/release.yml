name: release

# On a version tag (v0.3.0), build the panel and attach a prebuilt
# artifact to a GitHub Release. Both update paths consume this artifact —
# the panel's in-app updater and the ct script's update_script() via
# fetch_and_deploy_gh_release "prebuild" — so it carries the built server
# and web dists plus release.json, and the CT never runs a build (only
# `npm ci --omit=dev`).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (lint + typecheck + tests)
        run: npm run check
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      - name: Stamp release.json
        run: |
          cat > release.json <<EOF
          {
            "version": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat release.json

      - name: Pack artifact
        run: |
          tar czf "rallypoint-cmd-${GITHUB_REF_NAME}.tar.gz" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='apps/server/data' \
            --exclude='**/dist-types' \
            --exclude='*.tsbuildinfo' \
            release.json package.json package-lock.json tsconfig.base.json tsconfig.json \
            LICENSE packages apps ct install json deploy e2e eslint.config.js \
            .prettierrc.json vitest.config.ts
          ls -la rallypoint-cmd-*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "rallypoint-cmd-${GITHUB_REF_NAME}.tar.gz"
